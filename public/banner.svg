<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyber-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Cyber Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Left: Mascot & Brand Presentation -->
  <g transform="translate(60, 50)">
    <!-- RPG Badge / Tux Shield -->
    <rect x="0" y="0" width="130" height="130" rx="28" fill="#131d31" stroke="#334155" stroke-width="2" />
    <!-- Glowing Penguin Silhouette -->
    <circle cx="65" cy="50" r="28" fill="#e2e8f0" />
    <ellipse cx="65" cy="85" rx="36" ry="32" fill="#0f172a" />
    <ellipse cx="65" cy="88" rx="24" ry="22" fill="#f8fafc" />
    <polygon points="65,56 57,66 73,66" fill="#f59e0b" />
    <circle cx="56" cy="46" r="4" fill="#0f172a" />
    <circle cx="74" cy="46" r="4" fill="#0f172a" />
    <circle cx="58" cy="45" r="1.5" fill="#ffffff" />
    <circle cx="76" cy="45" r="1.5" fill="#ffffff" />

    <!-- Brand Category Pill -->
    <rect x="155" y="10" width="180" height="30" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="170" cy="25" r="4" fill="#eab308" filter="url(#glow-gold)" />
    <text x="182" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fef08a" letter-spacing="1">BOOT.DEV INSPIRED</text>

    <!-- Main Title -->
    <text x="155" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">
      LINUX<tspan fill="url(#cyber-gold)">QUEST</tspan>
    </text>

    <!-- Subtitle -->
    <text x="155" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
      The Gamified Command-Line RPG • Terminal Mastery &amp; Systems Engineering
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 160)">
      <!-- Tag 1: Interactive Terminal -->
      <rect x="0" y="0" width="145" height="36" rx="8" fill="#131d31" stroke="#38bdf8" stroke-width="1.2" />
      <text x="16" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8">💻 BROWSER VFS</text>

      <!-- Tag 2: XP & Streaks -->
      <rect x="157" y="0" width="140" height="36" rx="8" fill="#131d31" stroke="#eab308" stroke-width="1.2" />
      <text x="175" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#facc15">⚔️ XP &amp; STREAKS</text>

      <!-- Tag 3: Forensic Lore -->
      <rect x="309" y="0" width="150" height="36" rx="8" fill="#131d31" stroke="#a855f7" stroke-width="1.2" />
      <text x="325" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#c084fc">🕵️ WORLDBANC LORE</text>

      <!-- Tag 4: Zero Setup -->
      <rect x="471" y="0" width="135" height="36" rx="8" fill="#131d31" stroke="#10b981" stroke-width="1.2" />
      <text x="488" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399">⚡ ZERO SETUP</text>
    </g>

    <!-- Stats Bar -->
    <g transform="translate(0, 225)">
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#64748b">
        TRACKS: <tspan fill="#e2e8f0" font-weight="700">5 CURRICULA</tspan>  |  MISSIONS: <tspan fill="#e2e8f0" font-weight="700">25+ QUESTS</tspan>  |  ENGINE: <tspan fill="#e2e8f0" font-weight="700">VIRTUAL BASH 5.2</tspan>
      </text>
    </g>
  </g>

  <!-- Right: Glassmorphic Mini Terminal Showcase -->
  <g transform="translate(720, 45)">
    <!-- Terminal Window -->
    <rect width="430" height="325" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="430" height="38" rx="12" fill="#0f172a" />
    <path d="M 0 26 L 0 38 L 430 38 L 430 26 Z" fill="#0f172a" />
    <!-- Traffic lights -->
    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#10b981" />
    <text x="150" y="24" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" font-weight="500">tuxquest@worldbanc: ~</text>

    <!-- Terminal Code Simulation -->
    <g transform="translate(20, 60)" font-family="'JetBrains Mono', monospace" font-size="12">
      <!-- Line 1 -->
      <text x="0" y="20" fill="#38bdf8">user@worldbanc<tspan fill="#94a3b8">:</tspan><tspan fill="#eab308">~</tspan><tspan fill="#f8fafc">$</tspan> <tspan fill="#f1f5f9">whoami &amp;&amp; uname -r</tspan></text>
      <text x="0" y="42" fill="#a7f3d0">user</text>
      <text x="0" y="60" fill="#a7f3d0">6.8.9-arch1-1-tuxquest</text>

      <!-- Line 2 -->
      <text x="0" y="90" fill="#38bdf8">user@worldbanc<tspan fill="#94a3b8">:</tspan><tspan fill="#eab308">~</tspan><tspan fill="#f8fafc">$</tspan> <tspan fill="#f1f5f9">cat /var/log/syslog | grep ERROR</tspan></text>
      <text x="0" y="112" fill="#f87171">[ERROR] Unauthorized breach detected</text>
      <text x="0" y="130" fill="#f87171">[ERROR] Connection timed out on port 42100</text>

      <!-- Line 3 -->
      <text x="0" y="160" fill="#38bdf8">user@worldbanc<tspan fill="#94a3b8">:</tspan><tspan fill="#eab308">~</tspan><tspan fill="#f8fafc">$</tspan> <tspan fill="#f1f5f9">chmod 755 patch.sh &amp;&amp; ./patch.sh</tspan></text>
      <text x="0" y="185" fill="#facc15">⚔️ MISSION COMPLETE! +100 XP AWARDED</text>
      <text x="0" y="205" fill="#34d399">★ LEVEL UP! You are now [Terminal Hacker]</text>

      <!-- Cursor -->
      <text x="0" y="235" fill="#38bdf8">user@worldbanc<tspan fill="#94a3b8">:</tspan><tspan fill="#eab308">~</tspan><tspan fill="#f8fafc">$</tspan> <tspan fill="#f8fafc">_</tspan></text>
      <rect x="156" y="224" width="8" height="14" fill="#38bdf8" opacity="0.8" />
    </g>
  </g>
</svg>
